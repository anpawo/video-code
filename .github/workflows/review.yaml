name: Claude review of pull requests into main

# Started by review-request.yaml, it runs this file as main has it, never as the pull request has
# it: that is what keeps the token out of a pull request's reach. So nothing below may check out,
# build or run the pull request's code. Claude reads it through gh and git only.
# Not pull_request_target: Anthropic's token exchange refuses that event ("Invalid OIDC token",
# anthropics/claude-code-action#713).
on:
  workflow_run:
    workflows: ['Pull request into main, waiting for the Claude review']
    types: [completed]

concurrency:
  group: review-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude reads the pull request
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: claude
    env:
      # Claude's commands run without the Claude token in their environment, so a pull request
      # that talks Claude into printing it prints nothing. GitHub tokens stay.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read
      pull-requests: read
      id-token: write # traded by the action for the Claude GitHub App's token
    steps:
      - name: What this workflow runs
        run: |
          echo "On every pull request into main: Claude follows .github/prompts/review.md, reads the change without running it, comments, and posts the check 'Claude review' that main requires before a merge. Claude never merges: a person does, once the check is green." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4 # main, not the pull request

      - name: Bubblewrap, which the scrub above needs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The ruleset requires 'Claude review' from the Claude GitHub App, a check no
          # workflow token can forge. contents: read leaves the app's token unable to merge
          # or push, whatever a pull request asks of Claude.
          additional_permissions: |
            contents: read
            checks: write
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api repos/anpawo/video-code/check-runs:*),Bash(git fetch:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            Pull request #${{ github.event.workflow_run.pull_requests[0].number }}, head commit ${{ github.event.workflow_run.head_sha }}.
            Read `.github/prompts/review.md` in full and follow it exactly.
