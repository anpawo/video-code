name: Claude review of pull requests into main

# pull_request_target runs this file as main has it, never as the pull request has it: that
# is what keeps the token out of a pull request's reach. So nothing below may check out, build
# or run the pull request's code. Claude reads it through gh and git only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude reads the pull request
    # A stranger's pull request would spend Marius's subscription, and Claude's own audit
    # pull requests are read by Marius.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: claude
    permissions:
      contents: read
      pull-requests: read
      id-token: write # traded by the action for the Claude GitHub App's token
    steps:
      - name: What this workflow runs
        run: |
          echo "On every pull request into main: Claude follows .github/prompts/review.md, reads the change without running it, comments, posts the check 'Claude review' that main requires before a merge, and merges the pull request when it passes, unless it touches .github/." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4 # main, not the pull request

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The ruleset requires 'Claude review' from the Claude GitHub App, a check no
          # workflow token can forge.
          additional_permissions: |
            checks: write
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh api repos/anpawo/video-code/check-runs:*),Bash(git fetch:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            Pull request #${{ github.event.pull_request.number }}, head commit ${{ github.event.pull_request.head.sha }}.
            Read `.github/prompts/review.md` in full and follow it exactly.
