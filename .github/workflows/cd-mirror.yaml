name: Mirror to the Epitech repository

# Epitech grades the EIP from its own copy of this repository. Every push here
# is replayed there, branches and tags alike, by mirror.yaml, which this run
# starts and which runs from main: the key lives in the environment `mirror`,
# which only main can open. This file holds nothing and keeps its old name, which
# mirror.yaml listens for: a branch that still has the old version of this file
# starts the mirror too.

on:
  push:
    branches-ignore: ['ga-ignore-**']
  pull_request:
    types: [opened]
    branches-ignore: ['ga-ignore-**']

permissions: {}

jobs:
  request:
    name: Mirror requested
    runs-on: ubuntu-latest
    # Not from the copy itself, where this file also lives.
    if: github.repository != 'EpitechPromo2027/G-EIP-600-PAR-6-1-eip-marius.rousset'
    steps:
      - run: |
          echo "The push to EpitechPromo2027/G-EIP-600-PAR-6-1-eip-marius.rousset runs in 'Push every branch to the Epitech repository, from main', which this run starts." >> "$GITHUB_STEP_SUMMARY"
